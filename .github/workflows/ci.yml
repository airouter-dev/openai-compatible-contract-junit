name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp clean verify
      - name: Inspect packaged artifacts
        run: |
          test -f target/openai-compatible-contract-junit-0.1.0-sources.jar
          test -f target/openai-compatible-contract-junit-0.1.0-javadoc.jar
          jar tf target/openai-compatible-contract-junit-0.1.0.jar | grep -Fxq META-INF/LICENSE
          unzip -p target/openai-compatible-contract-junit-0.1.0.jar META-INF/MANIFEST.MF \
            | grep -Fq 'Automatic-Module-Name: dev.airouter.contract'
