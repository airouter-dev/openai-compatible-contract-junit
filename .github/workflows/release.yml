name: Maven Central release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be an immutable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Select Maven launcher
        run: |
          if [[ -x ./mvnw ]]; then
            echo 'MVN_CMD=./mvnw' >> "$GITHUB_ENV"
          else
            echo 'MVN_CMD=mvn' >> "$GITHUB_ENV"
          fi
      - name: Set up Java and release credentials
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Verify tag and POM version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          pom_version="$($MVN_CMD -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "v${pom_version}" = "$RELEASE_TAG"
          scm_tag="$($MVN_CMD -q -DforceStdout help:evaluate -Dexpression=project.scm.tag)"
          test "$scm_tag" = "$RELEASE_TAG"
      - name: Clean verification
        run: $MVN_CMD -B -ntp clean verify
      - name: Inspect packaged artifacts
        run: |
          test -f target/openai-compatible-contract-junit-0.1.0-sources.jar
          test -f target/openai-compatible-contract-junit-0.1.0-javadoc.jar
          jar tf target/openai-compatible-contract-junit-0.1.0.jar | grep -Fxq META-INF/LICENSE
          unzip -p target/openai-compatible-contract-junit-0.1.0.jar META-INF/MANIFEST.MF \
            | grep -Fq 'Automatic-Module-Name: dev.airouter.contract'
      - name: Upload user-managed Central deployment
        run: $MVN_CMD -B -ntp -Prelease deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
